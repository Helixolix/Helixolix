name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # каждые 12 часов
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Helixolix
          outputs: dist/github-contribution-grid-snake.svg

      - name: Ensure output branch exists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet refs/heads/output; then
            echo "output branch exists"
          else
            git checkout --orphan output
            git rm -rf .
            echo "# Output branch" > README.md
            git add README.md
            git commit -m "Create output branch"
            git push origin output
            git checkout main
          fi

      - name: Deploy Snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}